name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes against base
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Owner-approved 2026-11-24 (ADR 0003, #82): glib 0.18 enters only via Tauri's Linux GTK3 stack;
          # cargo tree shows it absent for the Windows/Android targets we build. Remove when glib >= 0.20 or a Linux bundle is added.
          allow-ghsas: GHSA-wrw7-89jp-8q8g
