[package]
name = "crypto-lab"
version = "0.1.0"
description = "Offline Crypto Lab research workstation"
edition = "2021"
publish = false

[lib]
name = "crypto_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
